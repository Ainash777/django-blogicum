<!DOCTYPE html>
<html>
<head>
    <title>Редактировать комментарий</title>
</head>
<body>
    <h2>Редактировать комментарий</h2>
    
    <form method="post">
        {% csrf_token %}
        <textarea name="text" rows="5" style="width: 100%;">{{ form.instance.text }}</textarea><br><br>
        <button type="submit">Сохранить изменения</button>
        <a href="{% url 'blog:post_detail' post_id %}">Отмена</a>
    </form>
</body>
</html>
